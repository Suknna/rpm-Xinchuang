# EL8 平台：官方 UBI8 镜像（digest 固定），RPM 打包。
# 路径一律相对仓库根；assets 缺省为 spec 同目录的 assets/。
# pre_build 是宿主机构建前置钩子名（scripts 侧映射为具体脚本），缺省表示无。
image: registry.access.redhat.com/ubi8/ubi@sha256:ed721ca811f29fa0fd8a4666aec2fb6771f3defbecc708a973d0b711d6f09293
family: rpm
el: el8
packages:
  openssh:
    spec: packaging/common/openssh/openssh.spec
    packaging: packaging/common/openssh
    assets: packaging/common/openssh
  bash:
    spec: platforms/el8/packages/bash/bash.spec
  chrony:
    spec: platforms/el8/packages/chrony/chrony.spec
    aux_source: 10
  ntp:
    spec: platforms/el8/packages/ntp/ntp.spec
    aux_source: 5
  sudo:
    spec: platforms/el8/packages/sudo/sudo.spec
  telnet:
    spec: platforms/el8/packages/telnet/telnet.spec
  vim:
    enabled: false   # Temporarily paused: excluded from scheduled, forced and retry builds.
    spec: platforms/el8/packages/vim/vim.spec
