# rpm-Xinchuang：单平台可复用流水线（仅 workflow_call，由 rpm-xinchuang.yml 的
# platform 矩阵按 discover 结果逐平台调用）。
#
# 每个平台一条完整独立链，平台间零共享：
#   * check 先本地 --platform scope 再网络 fetch——单个上游故障只失败所在平台；
#   * build → test → publish 按 built-/verified-/receipt-<platform>-<package>
#     工件精确关联，fail-fast:false，单个组合失败绝不阻断其他已验证组合发布；
#     test/publish/finalize 带 always() 对抗 needs 隐式全成功语义——单包失败
#     只影响自身，其余成功包照常验证/发布/收口（失败组合缺验证凭据被
#     verified marker 拦截）；
#   * finalize 只合并本平台的 receipt-<platform>-* 工件；prune/record 都带
#     --platform 精确字段校验（凭据平台字段与 scope 精确相等，前缀相似平台
#     绝不混淆）且 prune 额外带 --skip-merged（跨平台 v* 收口在父
#     maintain-merged 单例进行）；回写循环每轮强制回到最新远端分支重放凭据
#     （无 rebase 状态残留，push 冲突退避重试）；
#   * 无更新平台：check 成功且 has_updates=false，后续 job 全部 skip，平台整体
#     仍为 success。
#
# 安全边界：
#   * 顶层 contents:read，仅 publish / finalize 提升 contents:write，且不超过
#     调用方 platform job 声明的 contents:write 上限；
#   * 只用 github.token（随调用方权限派生），不使用 secrets:inherit；
#   * 不定义并发组：串行由调用方 rpm-xinchuang.yml 顶层 concurrency 统一保证；
#   * 所有第三方 action 固定到 commit SHA；基础镜像在 platforms/<id>/platform.yaml
#     以 digest 固定。
name: rpm-Xinchuang platform

on:
  workflow_call:
    inputs:
      platform:
        description: '目标平台 id（platforms/<id>/platform.yaml 目录名）'
        required: true
        type: string
      force:
        description: '强制重建该平台已启用组件的当前上游最新稳定版'
        required: false
        type: boolean
        default: false
      version:
        description: '强制构建的 OpenSSH 版本（格式 X.YpZ，留空=自动检测）'
        required: false
        type: string
        default: ''
      targets:
        description: '仅构建指定组合（调用方已做全局校验，留空=自动检测）'
        required: false
        type: string
        default: ''
      skip_release:
        description: '仅构建验证，不发布 Release、不清理、不回写'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '清理只演练（校验并列出将删除项），不删除、不回写'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: 检测 ${{ inputs.platform }} 的上游更新
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装配置解析依赖（job 隔离，不依赖其他 job 的安装）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: 检测本平台启用上游相对基线的更新（先本地 --platform scope 再网络 fetch）
        id: detect
        env:
          PLATFORM: ${{ inputs.platform }}
          FORCE_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          TARGETS: ${{ inputs.targets }}
        run: |
          args=()
          [ "$FORCE" = true ] && args+=(--force)
          [ -n "$FORCE_VERSION" ] && args+=(--openssh-version "$FORCE_VERSION")
          [ -n "$TARGETS" ] && args+=(--targets "$TARGETS")
          /usr/bin/python3 scripts/check_versions.py --platform "$PLATFORM" \
            --output "$GITHUB_OUTPUT" "${args[@]}"

  build:
    name: 构建 ${{ matrix.package }} (${{ matrix.platform }})
    needs: [check]
    if: needs.check.result == 'success' && needs.check.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      PLATFORM: ${{ matrix.platform }}
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ matrix.version }}
      URL: ${{ matrix.url }}
      PYTHON: /usr/bin/python3
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装配置解析依赖（job 隔离，不依赖其他 job 的安装）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: 统一构建入口（含产物门禁）
        run: |
          set -euo pipefail
          eval "$(/usr/bin/python3 scripts/project_config.py shell "$PLATFORM" "$PACKAGE")"
          cmd=(bash scripts/package.sh build "$PLATFORM" "$PACKAGE" "$VERSION")
          # OpenSSH 源与镜像固定，构建不接收 URL；upstream 组件必须携带官方源。
          case "$PACKAGE_KIND" in
            openssh-*) ;;
            *) cmd+=("$URL") ;;
          esac
          "${cmd[@]}"
      - name: 上传构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-${{ matrix.platform }}-${{ matrix.package }}
          path: dist/${{ matrix.platform }}/${{ matrix.package }}/
          if-no-files-found: error

  test:
    name: 安装验证 ${{ matrix.package }} (${{ matrix.platform }})
    needs: [check, build]
    if: always() && needs.check.result == 'success' && needs.check.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      PLATFORM: ${{ matrix.platform }}
      PACKAGE: ${{ matrix.package }}
      PYTHON: /usr/bin/python3
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装配置解析依赖（job 隔离，不依赖其他 job 的安装）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: 下载本组合构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-${{ matrix.platform }}-${{ matrix.package }}
          path: dist/${{ matrix.platform }}/${{ matrix.package }}/
      - name: 干净目标系统安装行为测试（SSH 五场景 / 组件 smoke）
        if: hashFiles(format('dist/{0}/{1}/SHA256SUMS', matrix.platform, matrix.package)) != ''
        run: bash scripts/package.sh test "$PLATFORM" "$PACKAGE"
      - name: 留下安装成功凭据
        if: hashFiles(format('dist/{0}/{1}/SHA256SUMS', matrix.platform, matrix.package)) != ''
        run: |
          mkdir -p verified
          printf '%s/%s\n' "$PLATFORM" "$PACKAGE" > "verified/$PLATFORM-$PACKAGE"
      - name: 上传安装验证凭据
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles(format('dist/{0}/{1}/SHA256SUMS', matrix.platform, matrix.package)) != ''
        with:
          name: verified-${{ matrix.platform }}-${{ matrix.package }}
          path: verified/
          if-no-files-found: error

  publish:
    name: 发布 ${{ matrix.package }} (${{ matrix.platform }})
    needs: [check, build, test]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.check.outputs.has_updates == 'true' &&
      inputs.skip_release != true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ matrix.platform }}
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ matrix.version }}
      URL: ${{ matrix.url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装发布依赖（publish_release 读取 rpm header 与校验清单）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-rpm python3-yaml
      - name: 下载安装验证凭据（缺失说明本组合构建或验证失败，发布随即失败）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-${{ matrix.platform }}-${{ matrix.package }}
          path: verified/
      - name: 下载本组合构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-${{ matrix.platform }}-${{ matrix.package }}
          path: dist/${{ matrix.platform }}/${{ matrix.package }}/
      - name: 幂等发布（校验资产完整后创建或重入，绝不在不一致时写凭据）
        if: hashFiles(format('verified/{0}-{1}', matrix.platform, matrix.package)) != ''
        run: |
          /usr/bin/python3 scripts/publish_release.py --dir "dist/$PLATFORM/$PACKAGE" \
            --platform "$PLATFORM" --package "$PACKAGE" --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" --source-url "$URL" --output "$GITHUB_OUTPUT"
      - name: 上传发布凭据（receipt + 构建 spec / DEB 元数据）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles(format('verified/{0}-{1}', matrix.platform, matrix.package)) != ''
        with:
          name: receipt-${{ matrix.platform }}-${{ matrix.package }}
          path: published/
          if-no-files-found: error

  finalize:
    name: 清理本平台历史 Release 并回写成功基线
    needs: [check, build, test, publish]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.check.outputs.has_updates == 'true' &&
      inputs.skip_release != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ inputs.platform }}
      BRANCH: ${{ github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 合并本平台全部组合的发布凭据
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: receipt-${{ inputs.platform }}-*
          path: published
          merge-multiple: true
      - name: 安装版本比较依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-rpm python3-yaml
      - name: 集中串行清理本平台历史 Release（先校验后删除，保留 Git tag）
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(published/receipts/*.json)
          [ "${#receipts[@]}" -gt 0 ] || { echo '本平台无成功发布的组合，跳过清理与回写'; exit 0; }
          dry=""
          [ "$DRY_RUN" = true ] && dry="--dry-run"
          # --platform 精确字段校验（前缀相似平台绝不混淆）+ --skip-merged：
          # 跨平台旧合并 v* 的维护在父 maintain-merged 单例进行，平台收口不触碰。
          /usr/bin/python3 scripts/prune_releases.py --repo "$GITHUB_REPOSITORY" \
            --platform "$PLATFORM" --skip-merged $dry "${receipts[@]}"
      - name: 回写本平台成功基线（每轮取最新分支重放 receipt + 防降级，无 rebase 状态残留）
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(published/receipts/*.json)
          [ "${#receipts[@]}" -gt 0 ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for i in 1 2 3 4 5; do
            # 每轮强制回到最新远端分支工作树：上一轮的本地 commit / 冲突残留全部
            # 丢弃，绝不留下 rebase 进行中状态；凭据在最新基线上重放。
            git fetch origin "$BRANCH" || { sleep 15; continue; }
            git checkout -f -B "$BRANCH" "origin/$BRANCH" || { sleep 15; continue; }
            # record 自带哈希校验与防降级；--platform 精确字段校验避免跨平台凭据混写。
            /usr/bin/python3 scripts/record_versions.py --platform "$PLATFORM" \
              version.json "${receipts[@]}" || { sleep 15; continue; }
            if git diff --quiet -- version.json; then
              echo "成功基线无变化（幂等，或并发更新已覆盖）"
              ok=1
              break
            fi
            git add version.json
            git commit -m "build: record published baselines" || { sleep 15; continue; }
            if git push origin "HEAD:$BRANCH"; then
              ok=1
              break
            fi
            echo "push 冲突，重试 $i/5"
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "回写重试耗尽（远端持续冲突）" >&2; exit 1; }
