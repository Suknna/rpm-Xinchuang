# rpm-Xinchuang：平台独立检测→构建→发布的父子流水线编排。
#
# 触发：
#   * schedule：北京时间每天 09:17（UTC 01:17）；
#   * workflow_dispatch：受控手动运行（强制版本 / 指定组合 / 仅构建 / 清理演练）。
#
# 安全边界：
#   * 无 pull_request 触发——外部 PR 永远不会拿到本仓库的任何 token；
#   * 顶层 contents:read；唯一进入子流水线的 platform job 声明 contents:write，
#     它是子流水线（platform.yml）写权限的硬上限——子内部仅 publish/finalize
#     提升；maintain-merged / scheduled-time 各自最小声明 write；
#   * 不使用 secrets:inherit：子流水线只用 github.token（随调用方权限派生），
#     GITHUB_TOKEN 仅对本仓库有效；
#   * 顶层 concurrency 串行排队整个运行（cancel-in-progress:false），子流水线
#     不定义并发组；所有第三方 action 固定到 commit SHA，基础镜像在
#     platforms/<id>/platform.yaml 以 digest 固定。
#
# 调度契约（构建/验证统一入口 scripts/package.sh，配置唯一来源 scripts/project_config.py）：
#   * discover：本地配置自动发现启用平台（check_versions.discover，全程无网络），
#     平台清单由启用 target（iter_targets）派生，新增平台零代码进入；同时预检
#     全局输入——targets 语法/未知组合是真错误，force/version 互斥在此拦截；
#   * tests：全局共享代码质量门控（本地行为测试是一等门禁），所有平台链的先决
#     条件，在父级只跑一次；
#   * platform：矩阵 fail-fast:false，逐平台调用本地可复用 platform.yml——每个
#     平台完整独立链 check（先 --platform 本地 scope 再网络 fetch）→build→test
#     →publish→finalize，单平台上游故障或构建失败绝不阻断其他平台；无更新平台
#     check 成功 skip，平台整体仍为 success；
#   * maintain-merged：全平台结束（always）后单例运行，tests/discover 成功且非
#     skip_release 才执行单一 prune --merged-only——只维护已被全面替代的跨平台
#     旧合并 Release，无凭据、不写基线，与平台结果无关；
#   * scheduled-time：仅当全平台成功且维护成功才记录时间（schedule 专属；回写
#     每轮强制回到最新远端分支，无 rebase 状态残留，push 冲突退避重试）。
name: rpm-Xinchuang

on:
  schedule:
    # 北京时间每天 09:17 = UTC 01:17
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建其他已启用组件的当前最新稳定版（Vim 暂停）'
        type: boolean
        default: false
      version:
        description: '强制构建的 OpenSSH 版本（格式 X.YpZ，留空=自动检测）'
        required: false
        type: string
        default: ''
      targets:
        description: '仅构建指定组合（pkg、pkg/platform、pkg@ver、pkg/platform@ver，逗号分隔；缺省版本用已发布基线，否则上游最新）'
        required: false
        type: string
        default: ''
      skip_release:
        description: '仅构建验证，不发布 Release、不清理、不回写'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '清理只演练（校验并列出将删除项），不删除、不回写'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rpm-xinchuang
  cancel-in-progress: false

jobs:
  discover:
    name: 本地配置自动发现平台（无网络）
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装配置解析依赖（job 隔离，不依赖其他 job 的安装）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: 本地校验全局输入并发现启用平台
        id: platforms
        env:
          FORCE: ${{ inputs.force }}
          FORCE_VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: |
          /usr/bin/python3 - <<'PYEOF'
          import json
          import os
          import sys

          sys.path.insert(0, "scripts")
          import check_versions

          # 平台清单由启用 target 派生（新增平台零改动）；global targets 复用
          # parse_selection 预检，语法/未知组合是真错误，全程无网络。
          platforms = check_versions.discover(
              targets=os.environ.get("TARGETS", "").strip(),
              force=os.environ.get("FORCE") == "true",
              openssh_version=os.environ.get("FORCE_VERSION", "").strip())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("platforms=" + json.dumps(platforms) + "\n")
          print("platforms:", ", ".join(platforms))
          PYEOF

  tests:
    name: 本地行为测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装系统测试依赖（rpmbuild 供真实 header 测试）
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-rpm python3-yaml
      - name: 运行本地行为测试
        run: /usr/bin/python3 -m unittest discover -s tests -v

  platform:
    name: 平台流水线 ${{ matrix.platform }}
    needs: [discover, tests]
    if: needs.discover.result == 'success' && needs.tests.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        # discover 输出字符串数组；strategy.matrix 必须是单维度 platform 的
        # 对象形式（裸数组不是合法 matrix 定义）。
        platform: ${{ fromJSON(needs.discover.outputs.platforms) }}
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: write
    with:
      platform: ${{ matrix.platform }}
      force: ${{ inputs.force || false }}
      version: ${{ inputs.version || '' }}
      targets: ${{ inputs.targets || '' }}
      skip_release: ${{ inputs.skip_release || false }}
      dry_run: ${{ inputs.dry_run || false }}

  maintain-merged:
    name: 清理已被全面替代的旧合并 Release（无凭据，不写基线）
    needs: [discover, tests, platform]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.tests.result == 'success' &&
      inputs.skip_release != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装版本比较依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-rpm python3-yaml
      - name: 集中维护旧合并 Release（先校验后删除，保留 Git tag）
        run: |
          set -euo pipefail
          dry=""
          [ "$DRY_RUN" = true ] && dry="--dry-run"
          # 单一收口：只维护跨平台旧合并 v*（替代校验共用平台侧实现），不接
          # 发布凭据、不删普通组合（各平台 finalize 已收口）、不回写基线。
          /usr/bin/python3 scripts/prune_releases.py --repo "$GITHUB_REPOSITORY" \
            --merged-only $dry

  scheduled-time:
    name: 记录最近一次成功调度时间
    needs: [discover, tests, platform, maintain-merged]
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      needs.discover.result == 'success' &&
      needs.tests.result == 'success' &&
      needs.platform.result == 'success' &&
      needs.maintain-merged.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 更新根目录 time 并提交（每轮取最新远端分支，无 rebase 状态残留）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH" || { sleep 15; continue; }
            git checkout -f -B "$BRANCH" "origin/$BRANCH" || { sleep 15; continue; }
            date -u +'%Y-%m-%dT%H:%M:%SZ' > "time"
            git add "time"
            git commit -m 'chore: record successful scheduled scan' || { sleep 15; continue; }
            if git push origin "HEAD:$BRANCH"; then
              ok=1
              break
            fi
            echo "push 冲突，重试 $i/5"
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "push 重试耗尽" >&2; exit 1; }
