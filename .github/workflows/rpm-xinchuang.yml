# rpm-Xinchuang：同一次定时任务检测并构建七组件（EL7/EL8）
#
# 触发：
#   * schedule：北京时间每天 09:17（UTC 01:17）检测 OpenSSH portable 更新，
#     同时通过 Anitya 检测其他六个组件的官方最新上游版本；
#   * workflow_dispatch：受控手动运行（可强制指定版本 / 仅构建不发布）。
#
# 安全边界：
#   * 无 pull_request 触发——外部 PR 永远不会拿到本仓库的任何 token；
#   * 默认仅 contents:read，仅发布、版本回写和 time 记录 job 需要 contents:write；
#   * GITHUB_TOKEN 仅对本仓库有效；
#   * 所有第三方 action 固定到 commit SHA；UBI 基础镜像固定 digest。
#
# 幂等与并发：
#   * concurrency 排队执行（不取消进行中的运行）；
#   * Release 按 tag 存在性 + 全部资产哈希校验后决定是否重入（不完整即失败，
#     绝不在资产不完整时回写版本）；
#   * 版本成功发布才回写；所有分支成功后写根目录 time（无更新也会提交）。
name: rpm-Xinchuang

on:
  schedule:
    # 北京时间每天 09:17 = UTC 01:17
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建六个组件的当前最新稳定版'
        type: boolean
        default: false
      version:
        description: '强制构建的 OpenSSH 版本（格式 X.YpZ，留空=自动检测）'
        required: false
        default: ''
      skip_release:
        description: '仅构建验证，不发布 Release、不回写版本'
        required: false
        type: boolean
        default: false
      repair_pam:
        description: '只重建并验证 OpenSSH EL7/EL8 与 sudo EL8 的 PAM 修复'
        type: boolean
        default: false
      retry_component:
        description: '仅补发指定组件/版本的 EL7+EL8（例 vim:9.2.1135）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: rpm-xinchuang
  cancel-in-progress: false

env:
  # 官方 UBI 基础镜像，固定 digest（升级 digest 属受控变更，与 local-*.sh 同步更新）
  UBI7_IMAGE: registry.access.redhat.com/ubi7/ubi@sha256:046e525722f14702c360dc6092324af7c21656e76b0c254b067871f1d4d3df68
  UBI8_IMAGE: registry.access.redhat.com/ubi8/ubi@sha256:ed721ca811f29fa0fd8a4666aec2fb6771f3defbecc708a973d0b711d6f09293

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.detect.outputs.new_version }}
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 一次检测七个上游项目的稳定版
        id: detect
        env:
          FORCE_VERSION: ${{ github.event.inputs.version }}
          FORCE_COMPONENTS: ${{ inputs.force }}
          REPAIR_PAM: ${{ inputs.repair_pam }}
          RETRY_COMPONENT: ${{ github.event.inputs.retry_component }}
        run: |
          if [ -n "$RETRY_COMPONENT" ]; then
            [ "$FORCE_COMPONENTS" != true ] && [ "$REPAIR_PAM" != true ] && [ -z "$FORCE_VERSION" ] || {
              echo 'retry_component 不可与 force/repair_pam/version 同时使用' >&2; exit 2;
            }
            python3 scripts/check_versions.py --retry-component "$RETRY_COMPONENT" --output "$GITHUB_OUTPUT"
          elif [ "$REPAIR_PAM" = true ]; then
            [ "$FORCE_COMPONENTS" != true ] && [ -z "$FORCE_VERSION" ] || {
              echo 'repair_pam 不可与 force/version 同时使用' >&2; exit 2;
            }
            python3 scripts/check_versions.py --repair-pam --output "$GITHUB_OUTPUT"
          elif [ "$FORCE_COMPONENTS" = true ]; then
            python3 scripts/check_versions.py --force --output "$GITHUB_OUTPUT"
          else
            python3 scripts/check_versions.py --output "$GITHUB_OUTPUT"
          fi
          if [ -n "$FORCE_VERSION" ]; then
            echo "$FORCE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+p[0-9]+$' || {
              echo "非法版本格式: $FORCE_VERSION（应为 X.YpZ）" >&2
              exit 1
            }
            echo "强制指定版本: $FORCE_VERSION"
            echo "new_version=$FORCE_VERSION" >> "$GITHUB_OUTPUT"
          fi

  component-build:
    name: 构建 ${{ matrix.package }} (${{ matrix.el }})
    needs: check
    if: needs.check.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 用仓库 spec 构建官方最新源码
        env:
          ENTRY: ${{ toJSON(matrix) }}
        run: |
          readarray -t args < <(python3 -c 'import json,os; p=json.loads(os.environ["ENTRY"]); print("\n".join(p[k] for k in ("package","el","version","url")))')
          # 候选版本先写入本次工作区；发布及安装验证都成功才回写默认分支。
          python3 - <<'PY'
          import json,os,pathlib
          row=json.loads(os.environ['ENTRY'])
          path=pathlib.Path('version.json')
          versions=json.loads(path.read_text())
          versions[row['package']][row['el']]=row['version']
          path.write_text(json.dumps(versions,indent=2,sort_keys=True)+'\n')
          PY
          if [ "${args[0]}:${args[1]}" = ntp:el7 ]; then
            bash scripts/fetch-ntp-openssl.sh "$PWD"
          fi
          if [ "${args[1]}" = el7 ]; then image="$UBI7_IMAGE"; else image="$UBI8_IMAGE"; fi
          docker run --rm -v "$PWD":/src -e SRC_DIR=/src "$image" \
            bash /src/scripts/build-upstream.sh "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-${{ matrix.package }}-${{ matrix.el }}
          path: dist/${{ matrix.package }}/${{ matrix.el }}/
          if-no-files-found: error

  component-install:
    name: 安装验证 ${{ matrix.package }} (${{ matrix.el }})
    needs: [check, component-build]
    if: always() && needs.check.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-${{ matrix.package }}-${{ matrix.el }}
          path: dist/${{ matrix.package }}/${{ matrix.el }}/
      - name: 干净 UBI 中安装并运行
        env:
          PKG: ${{ matrix.package }}
          EL: ${{ matrix.el }}
          VERSION: ${{ matrix.version }}
        run: |
          if [ "$EL" = el7 ]; then image="$UBI7_IMAGE"; else image="$UBI8_IMAGE"; fi
          docker run --rm -v "$PWD":/src:ro -e SRC_DIR=/src "$image" \
            bash /src/scripts/test-upstream-install.sh "$PKG" "$EL" "$VERSION"
      - name: 留下安装成功凭据
        env:
          PKG: ${{ matrix.package }}
          EL: ${{ matrix.el }}
        run: |
          mkdir -p verified
          printf '%s/%s\n' "$PKG" "$EL" > "verified/$PKG-$EL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ matrix.package }}-${{ matrix.el }}
          path: verified/
          if-no-files-found: error

  build-el7:
    needs: check
    if: needs.check.outputs.new_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 对齐 spec 版本
        env:
          NEW_VERSION: ${{ needs.check.outputs.new_version }}
        run: |
          sed -i "s/^%global ver .*/%global ver ${NEW_VERSION}/" spec/openssh.spec
          grep -n "%global ver" spec/openssh.spec
      - name: 在官方 UBI7 容器内构建
        run: |
          docker run --rm -v "$PWD":/src -e SRC_DIR=/src \
            "$UBI7_IMAGE" bash /src/scripts/build-in-container.sh el7
      - name: 产物质量门禁（verify-rpms）
        run: |
          docker run --rm -v "$PWD":/src:ro -e SRC_DIR=/src \
            "$UBI7_IMAGE" bash /src/scripts/verify-rpms.sh el7
      - name: 上传构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-el7
          path: |
            dist/el7/*.rpm
            dist/el7/SHA256SUMS
          if-no-files-found: error

  build-el8:
    needs: check
    if: needs.check.outputs.new_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 对齐 spec 版本
        env:
          NEW_VERSION: ${{ needs.check.outputs.new_version }}
        run: |
          sed -i "s/^%global ver .*/%global ver ${NEW_VERSION}/" spec/openssh.spec
          grep -n "%global ver" spec/openssh.spec
      - name: 在官方 UBI8 容器内构建
        run: |
          docker run --rm -v "$PWD":/src -e SRC_DIR=/src \
            "$UBI8_IMAGE" bash /src/scripts/build-in-container.sh el8
      - name: 产物质量门禁（verify-rpms）
        run: |
          docker run --rm -v "$PWD":/src:ro -e SRC_DIR=/src \
            "$UBI8_IMAGE" bash /src/scripts/verify-rpms.sh el8
      - name: 上传构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-el8
          path: |
            dist/el8/*.rpm
            dist/el8/SHA256SUMS
          if-no-files-found: error

  test-el7:
    needs: build-el7
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 下载构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms-el7
          path: dist/el7
      - name: 安装行为测试（5 场景，每场景独立干净容器）
        run: |
          fail=0
          for s in fresh upgrade reinstall uninstall symlink-guard; do
            echo "########## el7 / $s ##########"
            docker run --rm -v "$PWD":/src:ro -e SRC_DIR=/src \
              "$UBI7_IMAGE" bash /src/scripts/test-install.sh el7 "$s" || fail=1
          done
          exit $fail

  test-el8:
    needs: build-el8
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 下载构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms-el8
          path: dist/el8
      - name: 安装行为测试（5 场景，每场景独立干净容器）
        run: |
          fail=0
          for s in fresh upgrade reinstall uninstall symlink-guard; do
            echo "########## el8 / $s ##########"
            docker run --rm -v "$PWD":/src:ro -e SRC_DIR=/src \
              "$UBI8_IMAGE" bash /src/scripts/test-install.sh el8 "$s" || fail=1
          done
          exit $fail

  release:
    needs: [check, build-el7, build-el8, test-el7, test-el8]
    if: needs.check.outputs.new_version != '' && github.event.inputs.skip_release != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VER: ${{ needs.check.outputs.new_version }}
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 下载构建产物（按平台分目录，避免平铺覆盖）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms-el7
          path: dist/el7
      - name: 下载构建产物（EL8）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms-el8
          path: dist/el8
      - name: 展示产物
        run: find dist -type f | sort
      - name: 幂等发布 Release（EL7/EL8 构建+测试全部通过才到达此步）
        run: |
          set -uo pipefail
          REL="$(sed -n 's/^%global rel \([0-9][0-9]*\).*/\1/p' spec/openssh.spec | head -1)"
          [ -n "$REL" ] || { echo '无法读取 OpenSSH release' >&2; exit 1; }
          TAG="v${VER}-${REL}"
          # 期望资产：相对路径（el7/... el8/...）+ 两个改名后的 SUMS 文件
          expected="$(cd dist && ls el7/*.rpm el8/*.rpm | sort)"
          cp dist/el7/SHA256SUMS /tmp/SHA256SUMS-el7
          cp dist/el8/SHA256SUMS /tmp/SHA256SUMS-el8

          if python3 scripts/check_update.py has-release \
              --repo "$GITHUB_REPOSITORY" --tag "$TAG"; then
            # 重入路径：Release 已存在 → 必须证明资产完整且与本次产物逐一致，
            # 否则视为失败，不发布也不回写版本。
            echo "Release $TAG 已存在，校验资产完整性…"
            gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/assets.txt
            fail=0
            { for a in $expected; do basename "$a"; done
              echo SHA256SUMS-el7; echo SHA256SUMS-el8; } | sort -u |
            while read -r a; do
              grep -qx "$a" /tmp/assets.txt || echo "MISSING $a"
            done > /tmp/missing.txt
            if [ -s /tmp/missing.txt ]; then
              cat /tmp/missing.txt >&2
              echo "资产不完整，禁止重入（不发布、不回写版本）" >&2
              exit 1
            fi
            tmpd="$(mktemp -d)"
            gh release download "$TAG" --dir "$tmpd" --clobber
            for a in $expected; do
              l="$(sha256sum "dist/$a" | awk '{print $1}')"
              r="$(sha256sum "$tmpd/$(basename "$a")" | awk '{print $1}')"
              [ "$l" = "$r" ] || { echo "资产哈希不一致: $a (local=$l remote=$r)" >&2; exit 1; }
            done
            diff /tmp/SHA256SUMS-el7 "$tmpd/SHA256SUMS-el7" >/dev/null || { echo "SHA256SUMS-el7 不一致" >&2; exit 1; }
            diff /tmp/SHA256SUMS-el8 "$tmpd/SHA256SUMS-el8" >/dev/null || { echo "SHA256SUMS-el8 不一致" >&2; exit 1; }
            echo "资产校验通过：发布与回写均可安全重入"
            exit 0
          fi

          # 首次发布
          {
            echo "## OpenSSH ${VER}（EL7 / EL8, x86_64）"
            echo
            echo "基于官方 UBI7 / UBI8 容器（固定 digest）构建；静态链接 OpenSSL 与 zlib，"
            echo "动态链接 glibc / PAM / Kerberos5；不含图形 askpass。"
            echo "构建门禁：三包 EVR/arch 校验、ELF 无 libcrypto/libssl/libz 动态依赖、"
            echo "sshd 动态链接 libpam、PAM 模板为 password-auth 且默认 UsePAM yes、"
            echo "/etc 零 payload、5 项安装行为测试全部通过。"
            echo
            echo "### 安装 / 升级须知"
            echo "- 本包安装与升级**不会**自动重启、停止或重载正在运行的 sshd；"
            echo "  升级后请择机手动执行："
            echo "  \`service sshd restart\`（EL7）或 \`systemctl daemon-reload && systemctl restart sshd\`（EL8）。"
            echo "- 从发行版 openssh-server 升级时，**旧包自带的卸载脚本可能触发一次重启**；"
            echo "  本包已保证保留的配置可通过新版本语法检查（安装日志可见），但不对该重启作保证。"
            echo "- 严格配置保留：/etc 下的配置以 ghost 方式登记所有权、不随包分发内容；"
            echo "  任何升级都不会改写/移动/删除既有配置，也不会产生 .rpmnew/.rpmsave。"
            echo "- 默认配置模板位于 /usr/share/openssh/，仅当 /etc 中目标缺失时才会补齐。"
            echo "- 已安装旧坏包生成的 pam_stack.so 配置不会被覆盖；须由管理员通过安全通道手动修复。"
            echo "- 不会改写任何已有 host key；缺失密钥由 init 脚本在首次启动时补齐。"
            echo
            echo "### 产物校验"
            echo '```'
            cat /tmp/SHA256SUMS-el7 /tmp/SHA256SUMS-el8
            echo '```'
            echo "源码：openssh-${VER}.tar.gz（构建时已验证官方 GPG 签名）；"
            echo "OpenSSL 固定为 spec 内声明版本，不经 CI 自动升级。"
          } > /tmp/notes.md
          gh release create "$TAG" \
            dist/el7/*.rpm dist/el8/*.rpm \
            /tmp/SHA256SUMS-el7 /tmp/SHA256SUMS-el8 \
            --title "OpenSSH ${VER} RPM (EL7/EL8, x86_64)" \
            --notes-file /tmp/notes.md
      - name: 回写 OpenSSH spec 与统一版本文件
        run: |
          sed -i "s/^%global ver .*/%global ver ${VER}/" spec/openssh.spec
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('version.json')
          state = json.loads(path.read_text())
          state['openssh'] = os.environ['VER']
          path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
          PY
          if git diff --quiet -- spec/openssh.spec version.json; then
            echo "版本已是 ${VER}，无回写需求（幂等）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/openssh.spec version.json
          git commit -m "build: OpenSSH ${VER}"
          ok=0
          for i in 1 2 3 4 5; do
            if git fetch origin "$BRANCH" &&
               git rebase "origin/$BRANCH" &&
               git push origin "HEAD:$BRANCH"; then
              ok=1
              break
            fi
            echo "push 冲突，重试 $i/5"
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "push 重试耗尽" >&2; exit 1; }

  component-release:
    name: 发布 ${{ matrix.package }} (${{ matrix.el }})
    needs: [check, component-build, component-install, release]
    # Each package/platform is independent; a failed RPM has no published receipt.
    if: always() && needs.check.outputs.has_updates == 'true' && inputs.skip_release != true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PKG: ${{ matrix.package }}
      EL: ${{ matrix.el }}
      VERSION: ${{ matrix.version }}
      SOURCE_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 必须已经通过独立 UBI 安装验证
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-${{ matrix.package }}-${{ matrix.el }}
          path: verified/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-${{ matrix.package }}-${{ matrix.el }}
          path: dist/${{ matrix.package }}/${{ matrix.el }}/
      - name: 校验后创建 Release
        run: |
          set -euo pipefail
          dir="dist/$PKG/$EL"
          selection="$(bash scripts/select-release-rpm.sh "$dir" "$PKG" "$VERSION" "$EL")"
          IFS=$'\t' read -r rpmfile release <<< "$selection"
          tag="${PKG}-${EL}-${VERSION}-${release}"
          (cd "$dir" && sha256sum -c SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            gh release download "$tag" --dir "$tmp"
            for file in "$dir"/*.rpm "$dir/SHA256SUMS" "$dir/SOURCE-SHA256SUM" "$dir/$PKG-$EL.spec"; do
              cmp "$file" "$tmp/$(basename "$file")"
            done
          else
            gh release create "$tag" "$dir"/*.rpm "$dir/SHA256SUMS" \
              "$dir/SOURCE-SHA256SUM" "$dir/$PKG-$EL.spec" \
              --title "$PKG $VERSION RPM ($EL, x86_64)" \
              --notes "官方上游源码：$SOURCE_URL；使用仓库 spec/$PKG/$EL.spec 在 UBI${EL#el} 构建，经过干净 UBI 安装与命令验证。"
          fi
      - name: 保存通过安装验证的版本和 spec
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          package,el,version = (os.environ[k] for k in ("PKG","EL","VERSION"))
          built = pathlib.Path("dist")/package/el/(package+"-"+el+".spec")
          target = pathlib.Path("published/spec")/package/(el+".spec")
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(built,target)
          receipt = pathlib.Path("published/receipts")/(package+"-"+el+".json")
          receipt.parent.mkdir(parents=True,exist_ok=True)
          receipt.write_text(json.dumps({"package":package,"el":el,"version":version,
                                         "spec_sha256":hashlib.sha256(built.read_bytes()).hexdigest()}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ matrix.package }}-${{ matrix.el }}
          path: published/
          if-no-files-found: error

  component-record:
    name: 回写已发布版本与 spec
    needs: [check, component-release]
    if: always() && needs.check.outputs.has_updates == 'true' && inputs.skip_release != true && needs.component-release.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: published-*
          path: published
          merge-multiple: true
      - name: 合并已通过安装验证的组件
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          python3 scripts/record_versions.py version.json published/receipts/*.json
          if git diff --quiet -- version.json spec/; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json spec/
          git commit -m 'build: record published upstream versions'
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "版本回写重试 $i/5"
            sleep 15
          done
          exit 1

  scheduled-time:
    name: 记录最近一次成功调度时间
    needs: [check, release, component-build, component-install, component-release, component-record]
    if: >-
      github.event_name == 'schedule' &&
      needs.check.result == 'success' &&
      (needs.check.outputs.new_version == '' || needs.release.result == 'success') &&
      (needs.check.outputs.has_updates != 'true' ||
       (needs.component-build.result == 'success' &&
        needs.component-install.result == 'success' &&
        needs.component-release.result == 'success' &&
        needs.component-record.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 更新根目录 time 并提交
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "time"
          git add "time"
          git commit -m 'chore: record successful scheduled scan'
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep 15
          done
          exit 1
