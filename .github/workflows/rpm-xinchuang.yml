# rpm-Xinchuang：平台优先目录 + 统一 (platform, package) 矩阵的 RPM/DEB 构建发布流水线
#
# 触发：
#   * schedule：北京时间每天 09:17（UTC 01:17）通过 Anitya 检测全部启用上游版本；
#   * workflow_dispatch：受控手动运行（强制版本 / 指定组合 / 仅构建 / 清理演练）。
#
# 安全边界：
#   * 无 pull_request 触发——外部 PR 永远不会拿到本仓库的任何 token；
#   * 默认仅 contents:read，仅 publish / finalize 两个 job 需要 contents:write；
#   * GITHUB_TOKEN 仅对本仓库有效；
#   * 所有第三方 action 固定到 commit SHA；基础镜像在 platforms/<id>/platform.yaml
#     以 digest 固定。
#
# 调度契约（构建/验证统一入口 scripts/package.sh，配置唯一来源 scripts/project_config.py）：
#   * check 输出统一矩阵 {platform, package, version, url}，OpenSSH 所有平台与
#     组件一起进入矩阵，没有旧专用 build/test/release job；本地行为测试（tests）
#     是发布链的一等门禁：build → test → publish → finalize 全部 needs tests，
#     并在 always() 条件里显式要求 tests 成功；
#   * build → test → publish 三段按 built-<platform>-<package> /
#     verified-<platform>-<package> / receipt-<platform>-<package> 工件精确关联，
#     fail-fast:false，单个组合失败绝不阻断其他已验证组合发布；
#   * 每个宿主 job 独立安装自身依赖（python3-yaml / python3-rpm），宿主 Python
#     统一显式 /usr/bin/python3；
#   * publish 每组合幂等发布独立 Release（tag <platform>-<package>-<version>-<release>，
#     资产只有包文件 + SHA256SUMS；创建成功后仍需远程逐字节校验通过才写凭据），
#     并上传 published/ 凭据工件；
#   * finalize 单进程串行收口：receipt 全量预检 → 先校验后清理历史 Release
#     （保留 Git tag）→ 回写 version.json 成功基线（唯一回写对象，永不改写源
#     spec）。校验失败不删除、不回写；dry_run 只演练清理；skip_release 跳过
#     publish/finalize 全部写操作。
#   * 并发安全：concurrency 串行排队；finalize 回写每轮强制回到最新远端分支、
#     重放 receipt（record 自带防降级）再提交推送——不使用 rebase，冲突残留
#     不会累积，并发更新的更高基线不会被覆盖。
name: rpm-Xinchuang

on:
  schedule:
    # 北京时间每天 09:17 = UTC 01:17
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建其他已启用组件的当前最新稳定版（Vim 暂停）'
        type: boolean
        default: false
      version:
        description: '强制构建的 OpenSSH 版本（格式 X.YpZ，留空=自动检测）'
        required: false
        default: ''
      targets:
        description: '仅构建指定组合（chrony、chrony/el8、chrony@4.9、chrony/el8@4.9，逗号分隔；缺省版本用已发布基线，否则上游最新）'
        required: false
        default: ''
      skip_release:
        description: '仅构建验证，不发布 Release、不清理、不回写'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '清理只演练（校验并列出将删除项），不删除、不回写'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rpm-xinchuang
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装配置解析依赖（job 隔离，不依赖其他 job 的安装）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: 检测启用上游相对各平台基线的更新
        id: detect
        env:
          FORCE_VERSION: ${{ github.event.inputs.version }}
          FORCE: ${{ inputs.force }}
          TARGETS: ${{ github.event.inputs.targets }}
        run: |
          args=()
          [ -n "$FORCE_VERSION" ] && args+=(--openssh-version "$FORCE_VERSION")
          [ "$FORCE" = true ] && args+=(--force)
          [ -n "$TARGETS" ] && args+=(--targets "$TARGETS")
          /usr/bin/python3 scripts/check_versions.py --output "$GITHUB_OUTPUT" "${args[@]}"

  tests:
    name: 本地行为测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装系统测试依赖（rpmbuild 供真实 header 测试）
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-rpm python3-yaml
      - name: 运行本地行为测试
        run: /usr/bin/python3 -m unittest discover -s tests -v

  build:
    name: 构建 ${{ matrix.package }} (${{ matrix.platform }})
    needs: [check, tests]
    if: always() && needs.check.outputs.has_updates == 'true' && needs.tests.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      PLATFORM: ${{ matrix.platform }}
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ matrix.version }}
      URL: ${{ matrix.url }}
      PYTHON: /usr/bin/python3
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装配置解析依赖（job 隔离，不依赖其他 job 的安装）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: 统一构建入口（含产物门禁）
        run: |
          set -euo pipefail
          eval "$(/usr/bin/python3 scripts/project_config.py shell "$PLATFORM" "$PACKAGE")"
          cmd=(bash scripts/package.sh build "$PLATFORM" "$PACKAGE" "$VERSION")
          # OpenSSH 源与镜像固定，构建不接收 URL；upstream 组件必须携带官方源。
          case "$PACKAGE_KIND" in
            openssh-*) ;;
            *) cmd+=("$URL") ;;
          esac
          "${cmd[@]}"
      - name: 上传构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-${{ matrix.platform }}-${{ matrix.package }}
          path: dist/${{ matrix.platform }}/${{ matrix.package }}/
          if-no-files-found: error

  test:
    name: 安装验证 ${{ matrix.package }} (${{ matrix.platform }})
    needs: [check, tests, build]
    if: always() && needs.check.outputs.has_updates == 'true' && needs.tests.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      PLATFORM: ${{ matrix.platform }}
      PACKAGE: ${{ matrix.package }}
      PYTHON: /usr/bin/python3
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装配置解析依赖（job 隔离，不依赖其他 job 的安装）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: 下载本组合构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-${{ matrix.platform }}-${{ matrix.package }}
          path: dist/${{ matrix.platform }}/${{ matrix.package }}/
      - name: 干净目标系统安装行为测试（SSH 五场景 / 组件 smoke）
        if: hashFiles(format('dist/{0}/{1}/SHA256SUMS', matrix.platform, matrix.package)) != ''
        run: bash scripts/package.sh test "$PLATFORM" "$PACKAGE"
      - name: 留下安装成功凭据
        if: hashFiles(format('dist/{0}/{1}/SHA256SUMS', matrix.platform, matrix.package)) != ''
        run: |
          mkdir -p verified
          printf '%s/%s\n' "$PLATFORM" "$PACKAGE" > "verified/$PLATFORM-$PACKAGE"
      - name: 上传安装验证凭据
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles(format('dist/{0}/{1}/SHA256SUMS', matrix.platform, matrix.package)) != ''
        with:
          name: verified-${{ matrix.platform }}-${{ matrix.package }}
          path: verified/
          if-no-files-found: error

  publish:
    name: 发布 ${{ matrix.package }} (${{ matrix.platform }})
    needs: [check, tests, build, test]
    if: always() && needs.check.outputs.has_updates == 'true' && needs.tests.result == 'success' && inputs.skip_release != true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ matrix.platform }}
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ matrix.version }}
      URL: ${{ matrix.url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装发布依赖（publish_release 读取 rpm header 与校验清单）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-rpm python3-yaml
      - name: 下载安装验证凭据（缺失说明本组合构建或验证失败，发布随即失败）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-${{ matrix.platform }}-${{ matrix.package }}
          path: verified/
      - name: 下载本组合构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-${{ matrix.platform }}-${{ matrix.package }}
          path: dist/${{ matrix.platform }}/${{ matrix.package }}/
      - name: 幂等发布（校验资产完整后创建或重入，绝不在不一致时写凭据）
        if: hashFiles(format('verified/{0}-{1}', matrix.platform, matrix.package)) != ''
        run: |
          /usr/bin/python3 scripts/publish_release.py --dir "dist/$PLATFORM/$PACKAGE" \
            --platform "$PLATFORM" --package "$PACKAGE" --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" --source-url "$URL" --output "$GITHUB_OUTPUT"
      - name: 上传发布凭据（receipt + 构建 spec / DEB 元数据）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles(format('verified/{0}-{1}', matrix.platform, matrix.package)) != ''
        with:
          name: receipt-${{ matrix.platform }}-${{ matrix.package }}
          path: published/
          if-no-files-found: error

  finalize:
    name: 清理历史 Release 并回写成功基线
    needs: [check, tests, build, test, publish]
    if: always() && needs.check.outputs.has_updates == 'true' && needs.tests.result == 'success' && inputs.skip_release != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 合并全部组合的发布凭据
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: receipt-*
          path: published
          merge-multiple: true
      - name: 安装版本比较依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-rpm python3-yaml
      - name: 集中串行清理历史 Release（先校验后删除，保留 Git tag）
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(published/receipts/*.json)
          [ "${#receipts[@]}" -gt 0 ] || { echo '无成功发布的组合，跳过清理与回写'; exit 0; }
          dry=""
          [ "$DRY_RUN" = true ] && dry="--dry-run"
          /usr/bin/python3 scripts/prune_releases.py --repo "$GITHUB_REPOSITORY" $dry "${receipts[@]}"
      - name: 回写成功基线（每轮取最新分支重放 receipt + 防降级，无 rebase 状态残留）
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(published/receipts/*.json)
          [ "${#receipts[@]}" -gt 0 ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for i in 1 2 3 4 5; do
            # 每轮强制回到最新远端分支工作树：上一轮的本地 commit / 冲突残留全部
            # 丢弃，绝不留下 rebase 进行中状态；凭据在最新基线上重放。
            git fetch origin "$BRANCH" || { sleep 15; continue; }
            git checkout -f -B "$BRANCH" "origin/$BRANCH" || { sleep 15; continue; }
            # record 自带哈希校验与防降级：并发更新已写入的更高基线不会被覆盖。
            /usr/bin/python3 scripts/record_versions.py version.json "${receipts[@]}" || { sleep 15; continue; }
            if git diff --quiet -- version.json; then
              echo "成功基线无变化（幂等，或并发更新已覆盖）"
              ok=1
              break
            fi
            git add version.json
            git commit -m "build: record published baselines" || { sleep 15; continue; }
            if git push origin "HEAD:$BRANCH"; then
              ok=1
              break
            fi
            echo "push 冲突，重试 $i/5"
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "回写重试耗尽（远端持续冲突）" >&2; exit 1; }

  scheduled-time:
    name: 记录最近一次成功调度时间
    needs: [check, tests, build, test, publish, finalize]
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      needs.check.result == 'success' &&
      needs.tests.result == 'success' &&
      (needs.check.outputs.has_updates != 'true' ||
       (needs.build.result == 'success' &&
        needs.test.result == 'success' &&
        needs.publish.result == 'success' &&
        needs.finalize.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 更新根目录 time 并提交（每轮取最新远端分支，无 rebase 状态残留）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH" || { sleep 15; continue; }
            git checkout -f -B "$BRANCH" "origin/$BRANCH" || { sleep 15; continue; }
            date -u +'%Y-%m-%dT%H:%M:%SZ' > "time"
            git add "time"
            git commit -m 'chore: record successful scheduled scan' || { sleep 15; continue; }
            if git push origin "HEAD:$BRANCH"; then
              ok=1
              break
            fi
            echo "push 冲突，重试 $i/5"
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "push 重试耗尽" >&2; exit 1; }
