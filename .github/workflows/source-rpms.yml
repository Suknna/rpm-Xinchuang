name: 六个组件源码 RPM 构建与发布

on:
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
      skip_release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: '重新构建所有组件（包括已记录的源码包）'
        type: boolean
        default: false
      skip_release:
        description: '只构建验证，不发布或回写状态'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rhel-source-rpms
  cancel-in-progress: false

env:
  UBI7_IMAGE: registry.access.redhat.com/ubi7/ubi@sha256:046e525722f14702c360dc6092324af7c21656e76b0c254b067871f1d4d3df68
  UBI8_IMAGE: registry.access.redhat.com/ubi8/ubi@sha256:ed721ca811f29fa0fd8a4666aec2fb6771f3defbecc708a973d0b711d6f09293

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 一次查询全部源码仓库
        id: detect
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = true ]; then
            python3 scripts/check_sources.py --force
          else
            python3 scripts/check_sources.py
          fi

  build:
    needs: check
    if: needs.check.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 上游 SRPM 在对应 UBI 容器内安装依赖并构建
        env:
          ENTRY: ${{ toJSON(matrix) }}
        run: |
          readarray -t args < <(python3 -c 'import json,os; p=json.loads(os.environ["ENTRY"]); print("\n".join(p[k] for k in ("el","package","url","checksum_type","checksum","version","release")))')
          if [ "${args[0]}" = el7 ]; then image="$UBI7_IMAGE"; else image="$UBI8_IMAGE"; fi
          docker run --rm -v "$PWD":/src -e SRC_DIR=/src "$image" \
            bash /src/scripts/build-source-rpm.sh "${args[@]}"
      - name: 上传单组件单平台产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-${{ matrix.package }}-${{ matrix.el }}
          path: dist/${{ matrix.package }}/${{ matrix.el }}/
          if-no-files-found: error

  release:
    needs: [check, build]
    # Matrix builds are independent: one broken upstream spec must not block
    # other components that built successfully in the same daily run.
    if: always() && needs.check.outputs.has_updates == 'true' && inputs.skip_release != true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ENTRY: ${{ toJSON(matrix) }}
      PKG: ${{ matrix.package }}
      EL: ${{ matrix.el }}
      VER: ${{ matrix.version }}
      REL: ${{ matrix.release }}
      SOURCE_URL: ${{ matrix.url }}
      SOURCE_HASH: ${{ matrix.checksum }}
      HASH_TYPE: ${{ matrix.checksum_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-${{ matrix.package }}-${{ matrix.el }}
          path: dist/${{ matrix.package }}/${{ matrix.el }}
      - name: 校验并发布 Release
        run: |
          set -euo pipefail
          TAG="${PKG}-${EL}-${VER}-${REL}"
          DIR="dist/$PKG/$EL"
          (cd "$DIR" && sha256sum -c SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            gh release download "$TAG" --dir "$tmp"
            diff "$DIR/SHA256SUMS" "$tmp/SHA256SUMS"
            for rpmfile in "$DIR"/*.rpm; do
              cmp "$rpmfile" "$tmp/$(basename "$rpmfile")"
            done
            # Missing / extra assets invalidate a partial prior release.
            diff <(find "$DIR" -maxdepth 1 -type f -printf '%f\n' | sort) \
                 <(find "$tmp" -maxdepth 1 -type f -printf '%f\n' | sort)
          else
            gh release create "$TAG" "$DIR"/*.rpm "$DIR/SHA256SUMS" \
              --title "$PKG $VER-$REL ($EL, RHEL-compatible source RPM)" \
              --notes "基于对应平台的上游源码 RPM（含原 spec、补丁和源码）在官方 UBI 容器构建。来源：$SOURCE_URL；源码校验：$HASH_TYPE:$SOURCE_HASH。安装前请检查软件包的升级与服务脚本行为。"
          fi
      - name: 保存已发布源码指纹
        run: |
          mkdir -p published
          python3 -c 'import json,os; p=json.loads(os.environ["ENTRY"]); open("published/"+p["el"]+"-"+p["package"]+".json","w").write(json.dumps({"el":p["el"],"package":p["package"],"checksum":p["checksum"]}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ matrix.package }}-${{ matrix.el }}
          path: published/*.json
          if-no-files-found: error

  record:
    needs: [check, release]
    if: always() && needs.check.outputs.has_updates == 'true' && inputs.skip_release != true && needs.release.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: published-*
          path: published
          merge-multiple: true
      - name: 汇总全部成功发布的组件并回写一次
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/record_sources.py state/sources.json published/*.json
          if git diff --quiet -- state/sources.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/sources.json
          git commit -m 'build: record published source RPMs'
          for i in 1 2 3 4 5; do
            echo "回写重试 $i/5"
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep 15
          done
          exit 1
